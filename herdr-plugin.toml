id = "herdr-deck"
name = "Deck"
version = "0.1.5"
min_herdr_version = "0.9.3"
description = "A status pane next to each herdr-projects coordinator: tasks, threads, links and dev servers."
platforms = ["macos", "linux"]

# Downloads the prebuilt binary of the release named by `version` and checks
# it against the release's SHA256SUMS; builds from source (Go 1.27 or newer)
# when there is none or the checkout is not that release. A release tag must
# match `version` (CI checks it).
[[build]]
command = ["sh", "scripts/build.sh"]

# The deck itself. Opened by the toggle action and the auto-open hook, which
# pass the project through HERDR_DECK_PROJECT and start it in the project
# folder.
[[panes]]
id = "deck"
title = "Deck"
placement = "split"
command = ["bin/herdr-deck"]

# Opens a focused deck to the right of the focused pane, focuses the deck in
# this tab, or closes the deck when it has the focus. Bind it with
# [[keys.command]] type = "plugin_action", command = "herdr-deck.toggle".
[[actions]]
id = "toggle"
title = "Deck: show or hide"
contexts = ["workspace"]
command = ["bin/herdr-deck", "plugin", "toggle"]

# A coordinator started: open a deck next to it unless its workspace has one.
[[events]]
on = "pane.agent_detected"
command = ["bin/herdr-deck", "plugin", "agent-detected"]

# Opens a link the way the deck does: a Ctrl+clicked Figma link (below) in
# the Figma desktop app when figma.desktop is set in the deck's config, or
# the selected text's first link or Linear ID, such as ABC-123, in the
# configured linear.workspace. herdr only hands link handlers http(s) URLs,
# so a bare ID needs a selection: double-click it, then run this action from
# a key bound with [[keys.command]] type = "plugin_action",
# command = "herdr-deck.open-link".
[[actions]]
id = "open-link"
title = "Deck: open link or Linear ID"
contexts = ["selection", "pane"]
command = ["bin/herdr-deck", "plugin", "open-link"]

# The same Figma links the deck lists.
[[link_handlers]]
id = "figma"
title = "Open in Figma"
pattern = '^https://(www\.)?figma\.com/(design|file|proto|board)/'
action = "open-link"
